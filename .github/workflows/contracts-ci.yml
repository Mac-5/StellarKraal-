name: Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Run Soroban contract tests (stellarkraal)
        run: |
          cargo test --manifest-path contracts/stellarkraal/Cargo.toml
          echo "stellarkraal contract tests passed"

      - name: Run Soroban contract tests (lottery)
        run: |
          cargo test --manifest-path contracts/lottery/Cargo.toml
          echo "lottery contract tests passed"

      - name: Build release WASM (stellarkraal)
        run: |
          cargo build \
            --manifest-path contracts/stellarkraal/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Build release WASM (lottery)
        run: |
          cargo build \
            --manifest-path contracts/lottery/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Check WASM size (100 kB limit)
        run: |
          for WASM in $(find target/wasm32-unknown-unknown/release -name "*.wasm" -not -name "*.d"); do
            SIZE=$(wc -c < "$WASM")
            LIMIT=102400
            echo "WASM size: ${SIZE} bytes — ${WASM} (limit: ${LIMIT} bytes)"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error file=${WASM}::WASM binary exceeds 100 kB limit (${SIZE} bytes > ${LIMIT} bytes)"
              exit 1
            fi
          done
          echo "All WASM size checks passed"
